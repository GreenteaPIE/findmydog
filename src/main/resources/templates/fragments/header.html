<header class="site-header" th:fragment="header">
    <div class="container">
        <a class="brand" href="/" aria-label="Find My Dog 처음으로">
            <span class="brand__mark"><svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="14" cy="24" rx="6" ry="8"/><ellipse cx="25" cy="12" rx="6" ry="8"/><ellipse cx="39" cy="12" rx="6" ry="8"/><ellipse cx="50" cy="24" rx="6" ry="8"/><path d="M32 30c-9 0-17 10-17 18 0 5 4 8 9 8 4 0 5-2 8-2s4 2 8 2c5 0 9-3 9-8 0-8-8-18-17-18z"/></svg></span>
            <span class="brand__name">Find My Dog</span>
        </a>
        <nav class="nav" id="site-nav" aria-label="주요 메뉴">
            <a href="/posts" th:aria-current="${#strings.startsWith(currentPath, '/posts') and currentPath != '/posts/new'} ? 'page' : null">제보 목록</a>
            <a href="/map" th:aria-current="${currentPath == '/map'} ? 'page' : null">제보 지도</a>
            <a href="/adoption" th:aria-current="${currentPath == '/adoption'} ? 'page' : null">입양 공고</a>
            <a href="/guide" th:aria-current="${currentPath == '/guide'} ? 'page' : null">찾는 방법</a>
            <a th:unless="${loginUser}" href="/login" class="nav__login" th:aria-current="${currentPath == '/login'} ? 'page' : null">로그인</a>
        </nav>
        <div class="header-actions">
            <a href="/posts/new" class="btn btn--primary btn--sm btn--report">제보하기</a>
            <div class="user-menu" th:if="${loginUser}">
                <button type="button" aria-haspopup="true" aria-expanded="false" aria-controls="user-menu-panel">
                    <img th:if="${loginUser.picture}" th:src="${loginUser.picture}" alt="" referrerpolicy="no-referrer">
                    <span th:text="${loginUser.name}">이름</span>
                </button>
                <div class="user-menu__panel" id="user-menu-panel" hidden>
                    <a href="/my/posts">내가 쓴 제보</a>
                    <a href="/posts/new">제보하기</a>
                    <a href="/admin" th:if="${loginUser.admin}">신고 관리</a>
                    <hr>
                    <form th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
                    <button type="button" class="danger" data-delete-account>회원 탈퇴</button>
                </div>
            </div>
            <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="메뉴 열기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
        </div>
    </div>
</header>
