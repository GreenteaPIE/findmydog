<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head><title>만든 이유</title></head>
<body>
<main layout:fragment="content" class="container">
    <div class="page-head"><div><h1>만든 이유</h1></div></div>
    <div class="prose">
        <p>말티즈 루시와 산책하다 보면 전봇대마다 붙은 실종 전단을 자주 봐요. 비에 젖고 바람에 찢기는 전단을 보면서, 같은 동네 사람들이 한곳에서 제보를 모아 볼 수 있으면 좋겠다고 생각했어요.</p>
        <p>Find My Dog 은 실종·발견 제보를 지도에 모으고, 보호소에 들어온 강아지 공고를 함께 보여 주는 개인 프로젝트예요. 잃어버린 강아지가 하루라도 빨리 집에 돌아가길 바라며 만들고 있어요.</p>
        <h2>함께 만들기</h2>
        <p>잘못된 정보나 불편한 점은 <a href="https://github.com/GreenteaPIE/findmydog/issues" target="_blank" rel="noopener">GitHub 이슈</a>로 알려 주세요.</p>
    </div>
</main>
</body>
</html>
