<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head><title>로그인</title></head>
<body>
<main layout:fragment="content" class="container">
    <div class="login">
        <img src="/img/dog-bandana.png" alt="">
        <h1>로그인</h1>
        <p>제보를 올리고 연락처를 보려면 로그인해 주세요.</p>
        <div class="social">
            <a class="social--kakao" th:href="@{/oauth2/authorization/kakao}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.5 3 2 6.5 2 10.8c0 2.8 1.9 5.3 4.7 6.6l-1 3.6c-.1.3.3.6.6.4l4.3-2.8c.5.1.9.1 1.4.1 5.5 0 10-3.5 10-7.9S17.5 3 12 3z"/></svg>
                카카오로 시작하기</a>
            <a class="social--naver" th:href="@{/oauth2/authorization/naver}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M14.6 12.6 9.1 4.5H4.5v15h4.9v-8.1l5.5 8.1h4.6v-15h-4.9z"/></svg>
                네이버로 시작하기</a>
            <a class="social--google" th:href="@{/oauth2/authorization/google}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9c-.3 1.4-1 2.5-2.2 3.3v2.7h3.6c2-1.9 3.2-4.7 3.2-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.8C3.9 20.6 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.8 14.2c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2V7H2.1C1.4 8.5 1 10.2 1 12s.4 3.5 1.1 5l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.7 1 3.9 3.4 2.1 7l3.7 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>
                Google 계정으로 시작하기</a>
        </div>
        <a th:if="${demoMode}" class="btn btn--outline" style="width:100%;margin-top:10px" href="/demo/login">데모 계정으로 둘러보기</a>
        <small>로그인하면 이름, 이메일, 프로필 사진만 받아요. 언제든 탈퇴할 수 있어요.</small>
    </div>
</main>
</body>
</html>
