# 운영 설정: SPRING_PROFILES_ACTIVE=prod
# 필요한 환경 변수: DATABASE_URL(jdbc:postgresql://...), DATABASE_USERNAME, DATABASE_PASSWORD,
#                 GOOGLE/NAVER/KAKAO_CLIENT_ID·SECRET, KAKAO_MAP_KEY, DATA_GO_KR_SERVICE_KEY, FILE_UPLOAD_DIR, SITE_URL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
spring.session.jdbc.initialize-schema=always

# 프록시(로드밸런서) 뒤에서 https 주소로 OAuth 콜백을 만들기 위해
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.compression.enabled=true
spring.web.resources.cache.cachecontrol.max-age=7d
