spring.application.name=findmydog
server.servlet.encoding.force-response=true

# 개발용 인메모리 DB. 운영은 application-prod.properties (PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# 로컬에서만 쓰는 키 파일 (src/main/resources/application-oauth.properties, git 에 올리지 않음). 없어도 된다
spring.profiles.include=oauth

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# 사진 업로드: 한 장 10MB, 한 번에 30MB (최대 5장)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
# 업로드 이미지 저장 폴더. 환경 변수 FILE_UPLOAD_DIR 로 바꿀 수 있다 (예: Windows 에서 C:/download)
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# 카카오 지도 JavaScript 키 (카카오 개발자 콘솔에서 사이트 도메인을 등록해야 지도가 뜬다)
kakao.map.app-key=${KAKAO_MAP_KEY:54b2cd781663af1c76944546233135db}
# 공공데이터포털 '구조동물 조회 서비스' 인증키. 비워 두면 입양 공고를 화면 수집 방식으로 가져온다
adoption.service-key=${DATA_GO_KR_SERVICE_KEY:}
# 공유 링크(og:url)에 쓰는 사이트 주소. 예: https://findmydog.example.com
site.url=${SITE_URL:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---------- 소셜 로그인 ----------
# 키는 환경 변수로 넣는다. 값이 없으면 앱은 뜨지만 해당 로그인만 동작하지 않는다
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:unset}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/{action}/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:unset}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/{action}/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
